<!-- Example: Option 1 (Electric Cyan on Dark Slate) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#0F172A"/>
  <!-- Left arm: Solid Slash -->
  <path d="M 22 28 L 40 72 L 52 72 L 34 28 Z" fill="#38BDF8" />
  <!-- Right arm: Parallel Slash 1 -->
  <path d="M 48 72 L 62 28 L 70 28 L 56 72 Z" fill="#38BDF8" />
  <!-- Right arm: Parallel Slash 2 -->
  <path d="M 64 72 L 78 28 L 86 28 L 72 72 Z" fill="#0284C7" />
</svg>
